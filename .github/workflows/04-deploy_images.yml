name: 04 - Deploy images

on:
  workflow_dispatch:
    inputs: {}

env:
  resource_group: acilab
  location: westeurope
  repo_name: acilab
  public_domain: "cloudtrooper.net"
  private_domain: "cloudtrooper.net"

jobs:
  deploy_images:
    runs-on: ubuntu-latest
    steps:
      # checkout branch
      - name: git checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # log into Azure
      - name: "Login via Azure CLI"
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
  
      # Run script in repo
      - name: "Deploy images to ACI"
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        with:
          azcliversion: latest
          inlineScript: |
            chmod +x $GITHUB_WORKSPACE/scripts/deploy_images.sh
            $GITHUB_WORKSPACE/scripts/deploy_images.sh \
                -g=${{ env.resource_group }} \
                -l=${{ env.location }} \
                -r=${{ env.repo_name }} \
                -u=${{ secrets.SQL_USERNAME }} \
                -p=${{ secrets.SQL_PASSWORD }} \
                -z=${{ env.private_domain }} \
                -d=${{ env.public_domain }}
