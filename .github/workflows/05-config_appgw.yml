name: 05 - Configure App Gateway

on:
  workflow_dispatch:
    inputs: {}

env:
  resource_group: acilab
  public_domain: "cloudtrooper.net"
  private_domain: "cloudtrooper.net"

jobs:
  config_appgw:
    runs-on: ubuntu-latest
    steps:
      # checkout branch
      - name: git checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # log into Azure
      - name: "Login via Azure CLI"
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
  
      # Run script in repo
      - name: "Configure App GW rules"
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        with:
          azcliversion: latest
          inlineScript: |
            chmod +x $GITHUB_WORKSPACE/scripts/config_appgw.sh
            $GITHUB_WORKSPACE/scripts/config_appgw.sh \
                -g=${{ env.resource_group }} \
                -z=${{ env.private_domain }} \
                -d=${{ env.public_domain }}
